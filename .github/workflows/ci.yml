name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build backend
        working-directory: backend/UserDirectory.Api
        run: |
          dotnet restore
          dotnet build --configuration Release --no-restore

      - name: Run backend tests
        working-directory: backend/tests/UserDirectory.Api.Tests
        run: |
          dotnet test --no-build --verbosity normal

      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          npm ci

      - name: Build frontend
        working-directory: frontend
        run: |
          npm run build

      - name: Run frontend tests
        working-directory: frontend
        run: |
          npm test --silent
